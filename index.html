<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitar Agendamento Online - Dr. Newton Mureb</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="modal-overlay">
    <div class="modal-card">
      
      <!-- Cabeçalho Escuro -->
      <div class="modal-header">
        <div class="header-titles">
          <h1>Solicitar Agendamento Online</h1>
          <p>Escolha a filial, profissional e horário desejado</p>
        </div>
        <button type="button" class="btn-close" id="btnFechar" aria-label="Fechar">&times;</button>
      </div>

      <!-- Formulário -->
      <form id="formAgendamento" class="modal-body">
        
        <!-- 1. Unidade / Filial -->
        <div class="form-group full-width">
          <label for="unidade">1. Escolha a Unidade / Filial</label>
          <select id="unidade" name="unidade" required>
            <option value="Unidade Matriz Cabo Frio (Centro) (Cabo Frio/RJ)">Unidade Matriz Cabo Frio (Centro) (Cabo Frio/RJ)</option>
          </select>
        </div>

        <!-- 2. Especialista e 3. Procedimento (Mantendo as opções de Tipo de Atendimento) -->
        <div class="form-row">
          <div class="form-group">
            <label for="especialista">2. Especialista</label>
            <select id="especialista" name="especialista" required>
              <option value="Dr. Newton Mureb">Dr. Newton Mureb</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tipo_atendimento">3. Procedimento</label>
            <select id="tipo_atendimento" name="tipo_atendimento" required>
              <option value="" disabled selected>Selecione o tipo de atendimento</option>
              <option value="Primeira consulta">Primeira consulta</option>
              <option value="Retorno de consulta">Retorno de consulta</option>
              <option value="Modulação Hormonal Bioidêntica">Modulação Hormonal Bioidêntica</option>
              <option value="Avaliação de Exames">Avaliação de Exames</option>
              <option value="Acompanhamento Médico">Acompanhamento Médico</option>
            </select>
          </div>
        </div>

        <!-- Data Desejada e Horário Disponível -->
        <div class="form-row">
          <div class="form-group">
            <label for="data">Data Desejada</label>
            <input type="date" id="data" name="data" required />
          </div>

          <div class="form-group">
            <label for="horario">Horário Disponível</label>
            <select id="horario" name="horario" required disabled>
              <option value="">Selecione uma data...</option>
            </select>
          </div>
        </div>

        <hr class="divider" />

        <!-- Seus Dados de Contato -->
        <h2 class="section-title">Seus Dados de Contato</h2>

        <div class="form-group full-width">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Ana Paula Ferreira" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required />
          </div>

          <div class="form-group">
            <label for="celular">WhatsApp</label>
            <input type="tel" id="celular" name="celular" placeholder="(22) 99908-9122" maxlength="15" required />
          </div>
        </div>

        <!-- Campo oculto ou opcional de e-mail para manter compatibilidade caso necessário -->
        <input type="hidden" id="email" name="email" value="" />
        <input type="hidden" id="assunto" name="assunto" value="" />

        <!-- Mensagem de feedback -->
        <div id="statusMensagem" class="status-message" style="display: none;"></div>

        <hr class="divider" />

        <!-- Rodapé de Ações -->
        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="btnCancelar">Cancelar</button>
          <button type="submit" class="btn-submit" id="btnSubmit">Confirmar Agendamento</button>
        </div>

      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
